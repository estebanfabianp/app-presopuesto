{% extends "base.html" %}

{% set hide_sidebar = true %}

{% block title %}Recuperar Contraseña - App Presupuesto{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="login-title">Recuperar Contraseña</h1>
                <p class="login-subtitle">Ingresa tu correo y una nueva contraseña</p>
            </div>

            <form id="recoverForm" class="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label">Nueva contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="6" placeholder="Mínimo 6 caracteres">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="Repite la contraseña">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="submitBtn">
                    <i class="fas fa-unlock-alt"></i> Actualizar contraseña
                </button>

                <div id="errorAlert" class="alert alert-danger alert-dismissible" style="display:none;" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span id="errorMessage"></span>
                    <button type="button" class="btn-close" id="closeErrorAlert"></button>
                </div>

                <div id="successAlert" class="alert alert-success" style="display:none;" role="alert">
                    <i class="fas fa-check-circle"></i> <span id="successMessage"></span>
                </div>
            </form>

            <div class="login-footer">
                <p class="text-center mb-0">
                    <a href="/login" class="text-decoration-none">
                        <i class="fas fa-arrow-left"></i> Volver a iniciar sesión
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    document.getElementById('closeErrorAlert').addEventListener('click', () => {
        errorAlert.style.display = 'none';
    });

    document.getElementById('togglePassword').addEventListener('click', (e) => {
        e.preventDefault();
        const field = document.getElementById('newPassword');
        const icon = e.currentTarget.querySelector('i');
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            field.type = 'password';
            icon.className = 'fas fa-eye';
        }
    });

    document.getElementById('recoverForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!email || !newPassword) {
            errorMessage.textContent = 'Debes completar correo y contraseña.';
            errorAlert.style.display = 'block';
            return;
        }

        if (newPassword.length < 6) {
            errorMessage.textContent = 'La contraseña debe tener al menos 6 caracteres.';
            errorAlert.style.display = 'block';
            return;
        }

        if (newPassword !== confirmPassword) {
            errorMessage.textContent = 'La confirmación no coincide con la contraseña.';
            errorAlert.style.display = 'block';
            return;
        }

        const btn = document.getElementById('submitBtn');
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';

        try {
            const response = await api.request('POST', '/auth/reset-password', {
                email,
                new_password: newPassword,
            });

            successMessage.textContent = response.message || 'Contraseña actualizada correctamente.';
            successAlert.style.display = 'block';

            setTimeout(() => {
                window.location.href = '/login';
            }, 1800);
        } catch (error) {
            errorMessage.textContent = error.message || 'No fue posible recuperar la contraseña.';
            errorAlert.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = original;
        }
    });
});
</script>
{% endblock %}
