{% extends "base.html" %}

{% set hide_sidebar = true %}

{% block title %}500 - Error Interno del Servidor{% endblock %}

{% block content %}
<div class="error-container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column;">
    <div style="text-align: center;">
        <h1 style="font-size: 5rem; margin: 0; color: #dc3545;">
            <i class="fas fa-server"></i> 500
        </h1>
        <h2 style="font-size: 2rem; color: #333; margin: 20px 0;">Error Interno del Servidor</h2>
        <p style="color: #666; font-size: 1.1rem; margin-bottom: 30px;">
            Algo salió mal en nuestro servidor. Por favor, intenta más tarde.
        </p>
        <a href="/dashboard" class="btn btn-primary btn-lg">
            <i class="fas fa-arrow-left"></i> Volver al Dashboard
        </a>
    </div>
</div>
{% endblock %}
