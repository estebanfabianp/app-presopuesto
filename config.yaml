# =========================================
# Configuración general del proyecto
# =========================================
app:
  name: "app-presupuesto"
  version: "1.0.0"
  environment: "development"   # development | staging | production
  log_level: "INFO"

# =========================================
# Configuración de base de datos
# =========================================
database:
  type: "mysql"               # mysql | postgres | oracle
  host: "localhost"
  port: 3306
  name: "presupuesto_db"
  user: "presupuesto_user"
  password: "super_seguro_123"

# =========================================
# Rutas de datos
# =========================================
paths:
  raw_data: "data/raw/"
  processed_data: "data/processed/"
  models: "src/ml/models/"
  features: "src/ml/features/"
  logs: "logs/"
  reports: "reports/"
  exports: "exports/"           # exportación de reportes y datos

# =========================================
# Parámetros de negocio
# =========================================
business:
  moneda: "COP"
  max_gasto_mensual: 500000
  categorias:
    - "Ingresos"
    - "Gastos fijos"
    - "Gastos variables"
    - "Ahorro"
    - "Inversiones"
    - "Deudas"
    - "Tarjetas"

# =========================================
# Parámetros de Machine Learning
# =========================================
ml:
  model_type: "random_forest"  # random_forest | xgboost | logistic_regression
  test_size: 0.2
  random_state: 42
  classification_labels:
    - "Ingreso"
    - "Gasto fijo"
    - "Gasto variable"
    - "Otro"
  features:
    - "monto"
    - "descripcion"
    - "fecha"

# =========================================
# Automatización de procesos
# =========================================
scheduler:
  enabled: true
  interval: "daily"             # hourly | daily | weekly
  retrain_model: true           # volver a entrenar el modelo periódicamente
  generate_report: true
